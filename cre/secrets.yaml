# Secrets released to the enclave by the Vault DON. The left column is the secret id the workflow
# asks for (`runtime.getSecret({ id })`); the right is the environment variable the simulator reads
# it from locally (see cre/.env.example).
#
#   INTENT_PRIVKEY       secp256k1 private key that opens sealed order envelopes
#   LEDGER_MASTER_KEY    32-byte key from which per-account portfolio keys derive
#   ENCLAVE_SIGNING_KEY  secp256k1 key whose EIP-712 signatures the contracts verify
#   ALPACA_KEY_ID / ALPACA_SECRET_KEY   broker credentials (paper trading)
#   RELAY_AUTH_TOKEN     shared secret the relayer checks before spending gas. The relayer is
#                        publicly reachable once hosted, and every call it accepts costs HBAR.
#
# None of these ever leave the enclave in plaintext; the relayer only sees signed authorizations,
# and the contracts only see the signing key's *address*.
secretsNames:
  RELAY_AUTH_TOKEN:
    - CRE_RELAY_AUTH_TOKEN
  INTENT_PRIVKEY:
    - CRE_INTENT_PRIVKEY
  LEDGER_MASTER_KEY:
    - CRE_LEDGER_MASTER_KEY
  ENCLAVE_SIGNING_KEY:
    - CRE_ENCLAVE_SIGNING_KEY
  ALPACA_KEY_ID:
    - CRE_ALPACA_KEY_ID
  ALPACA_SECRET_KEY:
    - CRE_ALPACA_SECRET_KEY
